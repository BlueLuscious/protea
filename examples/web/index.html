<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Protea web example</title>
    <script type="importmap">
      {
        "imports": {
          "@luscious-garden/protea-core": "../../packages/core/dist/index.js",
          "@luscious-garden/protea-components": "../../packages/components/dist/index.js"
        }
      }
    </script>
    <script type="module" src="./main.mjs"></script>
  </head>
  <body>
    <h1>Protea web example</h1>
    <button id="open-dialog" type="button">Open dialogue</button>
    <button id="toggle-sidebar" type="button" aria-controls="example-sidebar" aria-expanded="false">
      Supplementary navigation
    </button>

    <nav id="example-sidebar" aria-label="Supplementary navigation" hidden>
      <ul>
        <li><a href="#open-dialog">Dialogue controls</a></li>
      </ul>
    </nav>

    <dialog id="example-dialog" aria-labelledby="dialog-title">
      <h2 id="dialog-title">Example dialogue</h2>
      <p>
        <label><input id="refuse-close" type="checkbox"> Refuse close requests</label>
      </p>
      <button id="close-dialog" type="button" autofocus>Close dialogue</button>
    </dialog>

    <button id="open-editor" type="button">Open editor</button>
    <dialog id="editor-dialog" aria-labelledby="editor-title">
      <h2 id="editor-title">Draft editor</h2>
      <p>
        <label for="editor-draft">Draft</label>
        <input id="editor-draft" type="text" autofocus>
      </p>
      <button id="save-draft" type="button">Save</button>
      <button id="discard-draft" type="button">Discard</button>
    </dialog>

    <p>
      <label for="show-help">Show help</label>
      <input id="show-help" type="checkbox" role="switch" aria-controls="help-content">
      <button id="toggle-help" type="button" aria-controls="help-content">Toggle help</button>
    </p>
    <p id="help-content" hidden>Use the dialogue or draft editor to try the closing controls.</p>
  </body>
</html>
