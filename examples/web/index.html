<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Protea web example</title>
    <script type="importmap">
      {
        "imports": {
          "@luscious-garden/protea-core": "../../packages/core/dist/index.js",
          "@luscious-garden/protea-components": "../../packages/components/dist/index.js",
          "@luscious-garden/protea-components/button": "../../packages/components/dist/api/families/button.api.js",
          "@luscious-garden/protea-components/capabilities": "../../packages/components/dist/api/capabilities/index.js",
          "@luscious-garden/protea-components/modal": "../../packages/components/dist/api/families/modal.api.js",
          "@luscious-garden/protea-components/select": "../../packages/components/dist/api/families/select.api.js",
          "@luscious-garden/protea-components/sidebar": "../../packages/components/dist/api/families/sidebar.api.js",
          "@luscious-garden/protea-components/switch": "../../packages/components/dist/api/families/switch.api.js",
          "@luscious-garden/protea-components/tabs": "../../packages/components/dist/api/families/tabs.api.js"
        }
      }
    </script>
    <script type="module" src="./main.mjs"></script>
  </head>
  <body>
    <h1>Protea web example</h1>
    <button id="open-dialog" type="button">Open dialogue</button>
    <button id="toggle-sidebar" type="button" aria-controls="example-sidebar" aria-expanded="false">
      Supplementary navigation
    </button>

    <nav id="example-sidebar" aria-label="Supplementary navigation" hidden>
      <ul>
        <li><a href="#open-dialog">Dialogue controls</a></li>
      </ul>
    </nav>

    <dialog id="example-dialog" aria-labelledby="dialog-title">
      <h2 id="dialog-title">Example dialogue</h2>
      <p>
        <label><input id="refuse-close" type="checkbox"> Refuse close requests</label>
      </p>
      <button id="close-dialog" type="button" autofocus>Close dialogue</button>
    </dialog>

    <button id="open-editor" type="button">Open editor</button>
    <dialog id="editor-dialog" aria-labelledby="editor-title">
      <h2 id="editor-title">Draft editor</h2>
      <p>
        <label for="editor-draft">Draft</label>
        <input id="editor-draft" type="text" autofocus>
      </p>
      <button id="save-draft" type="button">Save</button>
      <button id="discard-draft" type="button">Discard</button>
    </dialog>

    <p>
      <label for="show-help">Show help</label>
      <input id="show-help" type="checkbox" role="switch" aria-controls="help-content">
      <button id="toggle-help" type="button" aria-controls="help-content" aria-expanded="false">
        Toggle help
      </button>
    </p>
    <p id="help-content" hidden>Use the dialogue or draft editor to try the closing controls.</p>

    <p>
      <label for="theme-preference">Theme preference</label>
      <select id="theme-preference">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="system" selected>System</option>
      </select>
      <button id="use-system-theme" type="button">Use system theme</button>
    </p>
    <p>Effective theme: <output id="effective-theme"></output></p>
    <p><label><input id="refuse-theme" type="checkbox"> Refuse theme changes</label></p>

    <section aria-labelledby="note-title">
      <h2 id="note-title">Release notes</h2>
      <div id="note-tablist" role="tablist" aria-label="Note panels">
        <button id="note-preview-tab" type="button" role="tab"
          aria-controls="note-preview-panel" aria-selected="true">Preview</button>
        <button id="note-history-tab" type="button" role="tab"
          aria-controls="note-history-panel" aria-selected="false" tabindex="-1">History</button>
      </div>
      <div id="note-preview-panel" role="tabpanel" aria-labelledby="note-preview-tab" tabindex="0">
        <p>Review the release notes before sharing them.</p>
      </div>
      <div id="note-history-panel" role="tabpanel" aria-labelledby="note-history-tab" tabindex="0" hidden>
        <p>The draft was created and saved.</p>
      </div>
    </section>
  </body>
</html>
